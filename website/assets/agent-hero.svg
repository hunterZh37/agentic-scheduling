<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="#f8fafc"/>

  <!-- ======== LEFT: your calendars ======== -->
  <text x="48" y="46" font-size="14" font-weight="700" fill="#64748b" letter-spacing="2">YOUR CALENDARS</text>

  <!-- Work / Google -->
  <g filter="url(#card)">
    <rect x="48" y="64" width="272" height="132" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="72" cy="90" r="7" fill="#EA4335"/>
    <text x="88" y="95" font-size="15" font-weight="600" fill="#111827">Work</text>
    <text x="296" y="95" font-size="12" fill="#94a3b8" text-anchor="end">Google</text>
    <g fill="#eef2f7">
      <rect x="68" y="112" width="28" height="14" rx="3"/><rect x="102" y="112" width="28" height="14" rx="3"/><rect x="170" y="112" width="28" height="14" rx="3"/><rect x="204" y="112" width="28" height="14" rx="3"/><rect x="238" y="112" width="28" height="14" rx="3"/><rect x="272" y="112" width="28" height="14" rx="3"/>
      <rect x="68" y="132" width="28" height="14" rx="3"/><rect x="136" y="132" width="28" height="14" rx="3"/><rect x="170" y="132" width="28" height="14" rx="3"/><rect x="238" y="132" width="28" height="14" rx="3"/><rect x="272" y="132" width="28" height="14" rx="3"/>
      <rect x="102" y="152" width="28" height="14" rx="3"/><rect x="136" y="152" width="28" height="14" rx="3"/><rect x="204" y="152" width="28" height="14" rx="3"/><rect x="272" y="152" width="28" height="14" rx="3"/>
    </g>
    <g fill="#EA4335">
      <rect x="136" y="112" width="28" height="14" rx="3"/>
      <rect x="102" y="132" width="28" height="14" rx="3"/><rect x="204" y="132" width="28" height="14" rx="3"/>
      <rect x="68" y="152" width="28" height="14" rx="3"/><rect x="238" y="152" width="28" height="14" rx="3"/>
    </g>
  </g>

  <!-- Personal / Google -->
  <g filter="url(#card)">
    <rect x="48" y="232" width="272" height="132" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="72" cy="258" r="7" fill="#34A853"/>
    <text x="88" y="263" font-size="15" font-weight="600" fill="#111827">Personal</text>
    <text x="296" y="263" font-size="12" fill="#94a3b8" text-anchor="end">Google</text>
    <g fill="#eef2f7">
      <rect x="68" y="280" width="28" height="14" rx="3"/><rect x="102" y="280" width="28" height="14" rx="3"/><rect x="136" y="280" width="28" height="14" rx="3"/><rect x="204" y="280" width="28" height="14" rx="3"/><rect x="272" y="280" width="28" height="14" rx="3"/>
      <rect x="68" y="300" width="28" height="14" rx="3"/><rect x="102" y="300" width="28" height="14" rx="3"/><rect x="170" y="300" width="28" height="14" rx="3"/><rect x="238" y="300" width="28" height="14" rx="3"/><rect x="272" y="300" width="28" height="14" rx="3"/>
      <rect x="68" y="320" width="28" height="14" rx="3"/><rect x="136" y="320" width="28" height="14" rx="3"/><rect x="170" y="320" width="28" height="14" rx="3"/><rect x="238" y="320" width="28" height="14" rx="3"/><rect x="272" y="320" width="28" height="14" rx="3"/>
    </g>
    <g fill="#34A853">
      <rect x="170" y="280" width="28" height="14" rx="3"/><rect x="238" y="280" width="28" height="14" rx="3"/>
      <rect x="136" y="300" width="28" height="14" rx="3"/><rect x="204" y="300" width="28" height="14" rx="3"/>
      <rect x="102" y="320" width="28" height="14" rx="3"/><rect x="204" y="320" width="28" height="14" rx="3"/>
    </g>
  </g>

  <!-- School / Outlook -->
  <g filter="url(#card)">
    <rect x="48" y="400" width="272" height="132" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="72" cy="426" r="7" fill="#0078D4"/>
    <text x="88" y="431" font-size="15" font-weight="600" fill="#111827">School</text>
    <text x="296" y="431" font-size="12" fill="#94a3b8" text-anchor="end">Outlook</text>
    <g fill="#eef2f7">
      <rect x="68" y="448" width="28" height="14" rx="3"/><rect x="136" y="448" width="28" height="14" rx="3"/><rect x="170" y="448" width="28" height="14" rx="3"/><rect x="238" y="448" width="28" height="14" rx="3"/><rect x="272" y="448" width="28" height="14" rx="3"/>
      <rect x="102" y="468" width="28" height="14" rx="3"/><rect x="136" y="468" width="28" height="14" rx="3"/><rect x="204" y="468" width="28" height="14" rx="3"/><rect x="272" y="468" width="28" height="14" rx="3"/>
      <rect x="68" y="488" width="28" height="14" rx="3"/><rect x="102" y="488" width="28" height="14" rx="3"/><rect x="170" y="488" width="28" height="14" rx="3"/><rect x="204" y="488" width="28" height="14" rx="3"/><rect x="238" y="488" width="28" height="14" rx="3"/>
    </g>
    <g fill="#0078D4">
      <rect x="102" y="448" width="28" height="14" rx="3"/><rect x="204" y="448" width="28" height="14" rx="3"/>
      <rect x="68" y="468" width="28" height="14" rx="3"/><rect x="170" y="468" width="28" height="14" rx="3"/><rect x="238" y="468" width="28" height="14" rx="3"/>
      <rect x="272" y="488" width="28" height="14" rx="3"/>
    </g>
  </g>

  <!-- arrows: calendars -> platform -->
  <path d="M324 130 C 400 130, 420 210, 476 232" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M324 298 C 380 298, 420 298, 476 298" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M324 466 C 400 466, 420 386, 476 364" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ======== CENTER: the platform + agent ======== -->
  <text x="650" y="76" font-size="14" font-weight="700" fill="#64748b" letter-spacing="2" text-anchor="middle">ONE PLATFORM, RUN BY YOUR AGENT</text>

  <g filter="url(#card)">
    <rect x="480" y="96" width="340" height="436" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

    <!-- agent header -->
    <circle cx="520" cy="140" r="20" fill="#fef3c7" stroke="#d97706"/>
    <path d="M520 126 L523.5 136.5 L534 140 L523.5 143.5 L520 154 L516.5 143.5 L506 140 L516.5 136.5 Z" fill="#d97706"/>
    <text x="552" y="136" font-size="17" font-weight="700" fill="#111827">Your AI agent</text>
    <text x="552" y="155" font-size="13" fill="#64748b">every calendar, checked 24/7</text>

    <!-- unified week -->
    <g font-size="12" fill="#94a3b8" text-anchor="middle">
      <text x="536" y="192">Mon</text><text x="596" y="192">Tue</text><text x="656" y="192">Wed</text><text x="716" y="192">Thu</text><text x="776" y="192">Fri</text>
    </g>
    <g stroke="#f1f5f9">
      <line x1="506" y1="202" x2="794" y2="202"/><line x1="506" y1="262" x2="794" y2="262"/><line x1="506" y1="322" x2="794" y2="322"/><line x1="506" y1="382" x2="794" y2="382"/><line x1="506" y1="442" x2="794" y2="442"/>
    </g>
    <!-- merged busy blocks, colored by source calendar -->
    <rect x="512" y="210" width="48" height="40" rx="6" fill="#EA4335"/>
    <rect x="512" y="330" width="48" height="28" rx="6" fill="#34A853"/>
    <rect x="572" y="270" width="48" height="34" rx="6" fill="#0078D4"/>
    <rect x="632" y="210" width="48" height="28" rx="6" fill="#34A853"/>
    <rect x="632" y="390" width="48" height="40" rx="6" fill="#EA4335"/>
    <rect x="692" y="250" width="48" height="40" rx="6" fill="#0078D4"/>
    <rect x="692" y="330" width="48" height="28" rx="6" fill="#34A853"/>
    <rect x="752" y="222" width="48" height="34" rx="6" fill="#EA4335"/>
    <rect x="752" y="390" width="48" height="28" rx="6" fill="#0078D4"/>

    <!-- the slot the agent just booked -->
    <rect x="572" y="330" width="48" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="596" y="354" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Alex</text>

    <text x="650" y="508" font-size="13" fill="#64748b" text-anchor="middle">all of it synchronized into one view</text>
  </g>

  <!-- ======== RIGHT: request in, meeting out ======== -->
  <text x="880" y="76" font-size="14" font-weight="700" fill="#64748b" letter-spacing="2">YOU ASK, IN PLAIN TEXT</text>

  <!-- chat bubble -->
  <g filter="url(#card)">
    <path d="M896 96 h304 a16 16 0 0 1 16 16 v56 a16 16 0 0 1 -16 16 h-284 l-20 18 v-90 a16 16 0 0 1 16 -16 z" fill="#1f2937" transform="translate(-16,0)"/>
    <text x="904" y="132" font-size="15" fill="#ffffff">"Book 30 minutes with Alex</text>
    <text x="904" y="154" font-size="15" fill="#ffffff">next week."</text>
  </g>
  <text x="880" y="222" font-size="12" fill="#94a3b8">a text over WhatsApp, Slack, or the web</text>

  <!-- arrow: request -> agent -->
  <path d="M876 150 C 850 160, 838 180, 826 210" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- arrow: agent -> booked -->
  <path d="M826 400 C 846 420, 858 430, 876 444" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <text x="880" y="416" font-size="14" font-weight="700" fill="#64748b" letter-spacing="2">THE AGENT HANDLES THE REST</text>

  <!-- booked card -->
  <g filter="url(#card)">
    <rect x="880" y="432" width="336" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="916" cy="470" r="16" fill="#16a34a"/>
    <path d="M908 470 l6 6 l11 -12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="944" y="466" font-size="15" font-weight="700" fill="#111827">Booked: Alex, Tue 2:00 PM</text>
    <text x="944" y="488" font-size="13" fill="#64748b">free on all three calendars, invite sent,</text>
    <text x="944" y="506" font-size="13" fill="#64748b">reminders scheduled</text>
  </g>
</svg>
