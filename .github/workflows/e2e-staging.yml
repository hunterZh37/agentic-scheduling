name: e2e-staging

# End-to-end monitoring: drive the real UI (book, agent-book, reschedule, cancel)
# against the STAGING deploy every 4h and alert the owner on failure. Staging has
# E2E_STUB_CALENDAR=true, so no real calendar is touched and no one is emailed.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run e2e against staging
        id: e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          CI: "true"
        run: npx playwright test

      - name: Upload report + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Alert owner on failure
        if: failure()
        env:
          ALERT_URL: ${{ secrets.MONITOR_ALERT_URL }}
          ALERT_SECRET: ${{ secrets.MONITOR_ALERT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_URL" ] || [ -z "$ALERT_SECRET" ]; then
            echo "alert not configured (MONITOR_ALERT_URL / MONITOR_ALERT_SECRET); skipping"
            exit 0
          fi
          summary="staging e2e failed — one or more UI flows broke. Report + screenshots: $RUN_URL"
          curl -s -m 30 -X POST "$ALERT_URL" \
            -H "Authorization: Bearer $ALERT_SECRET" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"summary":%s}' "$(printf '%s' "$summary" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")" \
            || echo "alert POST failed"
